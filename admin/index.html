<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timer Admin</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    body { background: #14161a; color: #e8e8e8; height: auto; }
    .wrap { max-width: 900px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 1.4rem; } h2 { font-size: 1.05rem; margin: 0 0 10px; }
    .card { background: #1e2127; border-radius: 10px; padding: 14px; margin-bottom: 14px; }
    .preview { height: 200px; border-radius: 8px; overflow: hidden; margin-bottom: 14px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
    label { display: flex; flex-direction: column; font-size: .8rem; gap: 3px; color: #aaa; }
    input[type=text], input[type=number], input[type=password] {
      background: #0f1114; color: #eee; border: 1px solid #333; border-radius: 6px; padding: 8px; font-size: 1rem; width: 120px;
    }
    input[type=text].wide { width: 260px; } input[type=color] { width: 60px; height: 36px; border: 0; background: none; }
    button { background: #2d6cdf; color: #fff; border: 0; border-radius: 6px; padding: 10px 16px; font-size: 1rem; cursor: pointer; }
    button.green { background: #2e9b4f; } button.red { background: #c0392b; } button.grey { background: #444; }
    .hint { font-size: .8rem; color: #999; }
    #msg { font-size: .85rem; min-height: 1.2em; }
    #login { max-width: 320px; margin: 20vh auto; text-align: center; }
    #app { display: none; }
    a { color: #6aa3ff; }
  </style>
</head>
<body>
<div class="wrap">
  <div id="login" class="card">
    <h1>Timer Admin</h1>
    <form id="loginForm">
      <input type="password" id="pw" placeholder="Passwort" autofocus>
      <button type="submit">Login</button>
      <p id="loginErr" class="hint"></p>
    </form>
  </div>

  <div id="app">
    <h1>Timer Admin</h1>
    <div class="preview"><div class="timer" id="timer"><div class="t-title"></div><div class="t-time">--:--</div><div class="t-end"></div></div></div>

    <div class="card">
      <h2>Steuerung</h2>
      <div class="row">
        <label>Minuten <input type="number" id="dMin" min="0" value="5"></label>
        <label>Sekunden <input type="number" id="dSec" min="0" max="59" value="0"></label>
        <button class="green" id="bStart">Start</button>
        <button class="grey" id="bPause">Pause</button>
        <button class="grey" id="bResume">Weiter</button>
        <button class="red" id="bReset">Zurücksetzen</button>
      </div>
      <div class="row">
        <button class="grey" data-add="-60">−1 min</button>
        <button class="grey" data-add="-10">−10 s</button>
        <button class="grey" data-add="10">+10 s</button>
        <button class="grey" data-add="60">+1 min</button>
        <button class="grey" data-add="300">+5 min</button>
      </div>
    </div>

    <div class="card">
      <h2>Einstellungen</h2>
      <div class="row">
        <label>Titel (optional) <input type="text" class="wide" id="sTitle"></label>
        <label>Text bei Ablauf <input type="text" class="wide" id="sEnd"></label>
        <label><span>Titel anzeigen</span><input type="checkbox" id="sShowTitle"></label>
      </div>
      <div class="row">
        <label>Einmal blinken bei (Sek. Restzeit) <input type="number" id="sBlink" min="0"></label>
        <label>Dauerhaft orange ab (Sek.) <input type="number" id="sWarn" min="0"></label>
        <label>Rot blinken ab (Sek.) <input type="number" id="sCrit" min="0"></label>
      </div>
      <div class="row">
        <label>Orange Impulse (Anzahl) <input type="number" id="sFlashN" min="1" step="1"></label>
        <label>Rot-Blinken Start (Hz) <input type="number" id="sHzMin" min="0" step="any"></label>
        <label>Rot-Blinken Ende (Hz) <input type="number" id="sHzMax" min="0" step="any"></label>
        <label>Dunkel-Deckkraft (%) <input type="number" id="sDim" min="0" max="100" step="1"></label>
        <label>Blinken nach Ablauf (Hz, 0 = aus) <input type="number" id="sHzEnd" min="0" step="any"></label>
      </div>
      <div class="row">
        <label>Normal <input type="color" id="cNormal"></label>
        <label>Warnung <input type="color" id="cWarn"></label>
        <label>Kritisch <input type="color" id="cCrit"></label>
        <label>Hintergrund <input type="color" id="cBg"></label>
        <button class="grey" id="bDefaults">Standardwerte</button>
      </div>
      <p class="hint">Änderungen werden sofort an die Anzeige gesendet.</p>
    </div>

    <div class="card">
      <h2>Anzeige-Link</h2>
      <div class="row"><input type="text" id="link" class="wide" style="width:100%" readonly>
        <button class="grey" id="bCopy">Kopieren</button><a id="open" target="_blank">Öffnen</a></div>
      <p class="hint">Diesen Link auf dem Anzeige-Gerät / in OBS (Browserquelle) öffnen. Klick auf die Anzeige = Vollbild.</p>
      <div class="row"><label>Kanal (Topic) <input type="text" id="topic" class="wide"></label><button class="grey" id="bTopic">Übernehmen</button></div>
      <p id="msg"></p>
    </div>
    <button class="grey" id="bLogout">Logout</button>
  </div>
</div>

<script src="../config.js"></script>
<script src="../shared.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const KEY = "timer_admin_state";
let state;
try { state = JSON.parse(localStorage.getItem(KEY)); } catch (_) {}
state = state || JSON.parse(JSON.stringify(Timer.DEFAULT_STATE));
state.settings = Object.assign({}, Timer.DEFAULT_SETTINGS, state.settings);

// ---- Login ----
function showApp() { $("login").style.display = "none"; $("app").style.display = "block"; init(); }
if (sessionStorage.getItem("timer_auth") === "1") showApp();
$("loginForm").addEventListener("submit", (e) => {
  e.preventDefault();
  if ($("pw").value === Timer.CFG.adminPassword) { sessionStorage.setItem("timer_auth", "1"); showApp(); }
  else $("loginErr").textContent = "Falsches Passwort";
});
$("bLogout").onclick = () => { sessionStorage.removeItem("timer_auth"); location.reload(); };

// ---- Sync ----
let pending = false;
async function push() {
  state.rev = Date.now();
  localStorage.setItem(KEY, JSON.stringify(state));
  try { await Timer.publish(state); $("msg").textContent = "✔ Gesendet " + new Date().toLocaleTimeString(); }
  catch (e) { $("msg").textContent = "✖ Senden fehlgeschlagen: " + e.message; }
}
const pushSoon = (() => { let t; return () => { clearTimeout(t); t = setTimeout(push, 300); }; })();

function remaining() { return Timer.remaining(state, Date.now()); }
function setRemaining(ms) {
  ms = Math.max(0, ms);
  if (state.running) state.endAt = Date.now() + ms; else state.remainingMs = ms;
}

// ---- Steuerung ----
function duration() { return ((+$("dMin").value || 0) * 60 + (+$("dSec").value || 0)) * 1000; }
$("bStart").onclick = () => { state.running = true; state.endAt = Date.now() + duration(); push(); };
$("bPause").onclick = () => { if (!state.running) return; state.remainingMs = remaining(); state.running = false; push(); };
$("bResume").onclick = () => { if (state.running) return; state.running = true; state.endAt = Date.now() + state.remainingMs; push(); };
$("bReset").onclick = () => { state.running = false; state.remainingMs = duration(); push(); };
document.querySelectorAll("[data-add]").forEach((b) => b.onclick = () => { setRemaining(remaining() + b.dataset.add * 1000); push(); });

// ---- Einstellungen ----
const S = state.settings;
const fields = { sTitle: "title", sEnd: "endText", sBlink: "warnBlinkSec", sWarn: "warnColorSec", sCrit: "critBlinkSec",
                 sFlashN: "flashCount", sHzMin: "blinkMinHz", sHzMax: "blinkMaxHz", sDim: "blinkDim", sHzEnd: "endBlinkHz",
                 cNormal: "colorNormal", cWarn: "colorWarn", cCrit: "colorCrit", cBg: "bg" };
function loadFields() {
  for (const [id, k] of Object.entries(fields)) $(id).value = state.settings[k];
  $("sShowTitle").checked = state.settings.showTitle;
  const d = state.running ? remaining() : state.remainingMs;
  $("dMin").value = Math.floor(d / 60000); $("dSec").value = Math.round((d % 60000) / 1000);
}
for (const [id, k] of Object.entries(fields)) {
  $(id).addEventListener("input", () => {
    const num = $(id).type === "number";
    state.settings[k] = num ? Math.max(0, +$(id).value || 0) : $(id).value;
    pushSoon();
  });
}
$("sShowTitle").onchange = () => { state.settings.showTitle = $("sShowTitle").checked; pushSoon(); };
$("bDefaults").onclick = () => { state.settings = Object.assign({}, Timer.DEFAULT_SETTINGS); loadFields(); push(); };

// ---- Link / Topic ----
function updateLink() {
  const url = new URL("../", location.href); url.search = "";
  url.searchParams.set("t", Timer.getTopic());
  $("link").value = url.href; $("open").href = url.href;
}
$("bCopy").onclick = () => { navigator.clipboard.writeText($("link").value); $("msg").textContent = "Link kopiert"; };
$("topic").value = Timer.getTopic();
$("bTopic").onclick = () => {
  const t = $("topic").value.trim(); if (!t) return;
  localStorage.setItem("timer_topic", t); updateLink(); push();
};

function init() {
  loadFields(); updateLink();
  const root = $("timer");
  const tick = () => Timer.render(root, state, Date.now());
  setInterval(tick, 50); tick();
}
</script>
</body>
</html>
